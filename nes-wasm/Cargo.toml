[package]
name = "nes-wasm"
version = "0.3.0"
description = "WebAssembly bindings for the nes-sim NES emulator core."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nes-sim = { workspace = true }
wasm-bindgen = "0.2"

[package.metadata.scripts]
# 从 workspace 根目录执行
build = "wasm-pack build nes-wasm --target web --release"
build-dev = "wasm-pack build nes-wasm --target web --dev"
clippy = "cargo clippy -p nes-wasm --target wasm32-unknown-unknown --all-targets --fix"
smoke = "node nes-wasm/smoke.mjs"

[lints]
workspace = true
