[workspace]
members = ["nes-sim", "nes-desktop", "nes-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
# as_chunks_mut 等标准库 API 需 1.88
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/taiyuuki/nes-sim"
homepage = "https://github.com/taiyuuki/nes-sim"
keywords = ["nes", "game", "emulator", "nintendo"]

[workspace.dependencies]
nes-sim = { version = "0.3.0", path = "nes-sim" }
cpal = "0.18.2"
minifb = "0.28.0"

[profile.release]
lto = "fat"
codegen-units = 1

[workspace.metadata.scripts]
fmt = "cargo fmt"
cgs = "codegraph sync"
cginit = "codegraph init"
test = "cargo test"
demo = "./web/build.sh"
serve = "python3 -m http.server -d web 8000"

[workspace.lints.clippy]
upper_case_acronyms = "allow"