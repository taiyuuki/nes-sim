# 发版:推送 v* tag 时发布 crates.io (nes-sim) 与 npm (nes-wasm)
#
# 凭据:
#   CARGO_REGISTRY_TOKEN — 配置在 "crates.io" Environment secrets
#                          (Settings → Environments → crates.io),仅声明了
#                          environment: crates.io 的 job 可见
#   npm 发布走 Trusted Publisher(在 npmjs.com 包设置中绑定本仓库与本
#   工作流文件),无需令牌;要求 npm ≥ 11.5 且 job 持有 id-token: write
#
# 发版步骤:
#   1. 同步升级 nes-sim 与 nes-wasm 的 Cargo.toml 版本(两者需一致)
#   2. 提交并打 tag: git tag v0.4.1 && git push origin v0.4.1
#   3. tag 与版本不一致时工作流会拒绝发布
#
# Pages 演示页由 pages.yml 在 main 分支自动部署,无需在此处理。

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    name: crates.io (nes-sim)
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag must match nes-sim version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' nes-sim/Cargo.toml | head -n1)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match nes-sim version $VER"
            exit 1
          fi
      - name: Publish
        run: cargo publish -p nes-sim --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: npm (nes-wasm)
    runs-on: ubuntu-latest
    # npm Trusted Publisher 经 OIDC 认证,必须持有 id-token 写权限
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm for Trusted Publisher OIDC
        run: npm install -g npm@latest
      - name: Tag must match nes-wasm version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' nes-wasm/Cargo.toml | head -n1)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match nes-wasm version $VER"
            exit 1
          fi
      - name: Build pkg
        run: wasm-pack build nes-wasm --target web --release
      - name: Publish
        run: npm publish nes-wasm/pkg --access public
