name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # nes-sim零依赖; nes-desktop需要系统图形/音频库, 其clippy在desktop job的mac/win上跑
      - name: clippy (core)
        run: cargo clippy -p nes-sim --all-targets --all-features -- -D warnings

  test:
    name: Test core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # blargg等fixture目录为gitignored可选项, CI上缺失时相关测试自动跳过
      - name: Test (release, all features)
        run: cargo test --release -p nes-sim --all-features

  desktop:
    name: Build desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # linux的minifb/cpal需要系统X11/Wayland依赖, 桌面前端只测macOS/Windows
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p nes-desktop --all-targets -- -D warnings
      - name: Build
        run: cargo build --release -p nes-desktop
      - name: Test
        run: cargo test --release -p nes-desktop

  wasm:
    name: WASM build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build nes-wasm
        run: wasm-pack build nes-wasm --target web --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # fixture ROM 缺失时 smoke.mjs 自动改用合成 NROM
      - name: Smoke test (node)
        run: node nes-wasm/smoke.mjs
